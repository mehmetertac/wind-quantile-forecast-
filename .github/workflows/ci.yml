name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install locked runtime (wheels only)
        run: 'python -m pip install --only-binary=:all: --require-hashes -r requirements.lock'

      - name: Install package (editable, no deps)
        run: 'python -m pip install --only-binary=:all: --no-deps -e .'

      - name: Smoke test
        run: python scripts/smoke_test.py