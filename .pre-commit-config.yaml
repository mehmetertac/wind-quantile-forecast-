repos:
  - repo: local
    hooks:
      - id: check-file-size
        name: Check file size (max 1000 lines)
        entry: py scripts/check_file_size.py
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: Run unit tests
        entry: py -m pytest -q
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: [--fix]
